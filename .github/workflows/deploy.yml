name: Deploy to Server

on:
  push:
    branches:
      - main  # sadece main'e push edilince tetikle

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            git -C /home/pazarlama/pazarlama-bot2 fetch origin main
            git -C /home/pazarlama/pazarlama-bot2 reset --hard origin/main
            cd /home/pazarlama/pazarlama-bot2/frontend
            npm install
            npm run build
            cd /home/pazarlama/pazarlama-bot2/backend
            npm install
            npm run db:migrate
            pm2 restart pazarlamabot
            pm2 restart pazarlamabot-frontend
