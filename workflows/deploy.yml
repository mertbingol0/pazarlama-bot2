name: Deploy to Server

on:
  push:
    branches:
      - main  # sadece main'e push edilince tetikle

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /home/pazarlama/pazarlama-bot2/backend
            git -C /home/pazarlama/pazarlama-bot2 pull origin main
            npm install
            pm2 restart pazarlamabot
